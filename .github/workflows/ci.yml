name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests
      - name: Check frontend syntax
        run: |
          node --check static/js/app.js
          node --check static/js/research-stream.js
      - name: Test research stream handling
        run: node --test tests/test_research_stream.cjs
      - name: Check offline answer regressions
        run: python scripts/run_quality_eval.py --split all --retrieval keyword --output data/quality-ci.json --compare evaluation/reports/quality-latest.json --fail-on-regression
